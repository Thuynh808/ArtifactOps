---
- name: configure artifactory
  hosts: artifactory
  vars_files:
    - vars/secret-vars.yml
  tasks:
  - name: set artifactory admin password before first login
    copy:
      dest: "/var/opt/jfrog/artifactory/etc/bootstrap.creds"
      content: "admin@jfrog.com:{{ artifactory_admin_password }}"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: create security directory
    file:
      path: "/opt/jfrog/artifactory/var/etc/security"
      state: directory
      owner: artifactory
      group: artifactory
      mode: '0700'
  - name: create join.key file
    copy:
      content: "{{ join_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/join.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: create master.key file
    copy:
      content: "{{ master_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/master.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: deploy system.yaml configuration
    template:
      src: "system.j2"
      dest: "/opt/jfrog/artifactory/var/etc/system.yaml"
      owner: artifactory
      group: artifactory
      mode: '0644'
  - name: enable http in firewalld
    firewalld:
      service: http
      state: enabled
      permanent: true
      immediate: true
  - name: open firewall port 8082 and 8081
    firewalld:
      port: "{{ item }}/tcp"
      state: enabled
      permanent: true
      immediate: true
    loop:
      - 8082
      - 8081
  - name: allow selinux listen on tcp port 8082 and 8081
    seport:
      ports: "{{ item }}"
      proto: tcp
      setype: http_port_t
      state: present
    loop:
      - 8082
      - 8081
  - name: restart artifactory and firewalld
    service:
      name: "{{ item }}"
      state: restarted
      enabled: true
    loop:
      - firewalld
      - artifactory
