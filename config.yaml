---
- name: configure artifactory
  hosts: artifactory
  vars_files:
    - vars/secret-vars.yml
  vars:
    artifactory_url: "http://{{ hostvars['node1']['ansible_host'] }}:8081/artifactory"
    repositories:
      - name: "docker-dev"
        description: "Development Docker Repository"
      - name: "docker-prod"
        description: "Production Docker Repository"
      - name: "docker-quarantine"
        description: "Quarantined Docker Repository"
  tasks:
  - name: set artifactory admin password before first login
    copy:
      dest: "/var/opt/jfrog/artifactory/etc/bootstrap.creds"
      content: "admin@jfrog.com:{{ artifactory_admin_password }}"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: create security directory
    file:
      path: "/opt/jfrog/artifactory/var/etc/security"
      state: directory
      owner: artifactory
      group: artifactory
      mode: '0700'
  - name: create join.key file
    copy:
      content: "{{ join_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/join.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: create master.key file
    copy:
      content: "{{ master_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/master.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: deploy system.yaml configuration
    template:
      src: "system.j2"
      dest: "/opt/jfrog/artifactory/var/etc/system.yaml"
      owner: artifactory
      group: artifactory
      mode: '0644'
  - name: open firewall port 8082
    firewalld:
      port: 8082/tcp
      state: enabled
      permanent: true
      immediate: true
  - name: allow selinux listen on tcp port 8082
    seport:
      ports: 8082
      proto: tcp
      setype: http_port_t
      state: present
  - name: create artifactory repositories
    uri:
      url: "{{ artifactory_url }}/api/repositories/{{ item.name }}"
      method: PUT
      user: "{{ artifactory_username }}"
      password: "{{ artifactory_password }}"
      force_basic_auth: yes
      headers:
        Content-Type: "application/json"
      body: |
        {
          "key": "{{ item.name }}",
          "rclass": "local",
          "packageType": "docker",
          "description": "{{ item.description }}",
          "dockerApiVersion": "V2",
          "repoLayoutRef": "simple-default",
          "handleReleases": true,
          "handleSnapshots": true
        }
      body_format: json
      status_code: [200, 201]
    loop: "{{ repositories }}"
    register: repo_creation
  - name: restart artifactory and firewalld
    service:
      name: "{{ item }}"
      state: restarted
      enabled: true
    loop:
      - firewalld
      - artifactory
