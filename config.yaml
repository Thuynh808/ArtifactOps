---
- name: configure artifactory
  hosts: artifactory
  vars_files:
    - vars/secret-vars.yml
  tasks:
  - name: create security directory
    file:
      path: "/opt/jfrog/artifactory/var/etc/security"
      state: directory
      owner: artifactory
      group: artifactory
      mode: '0700'
  - name: create join.key file
    copy:
      content: "{{ join_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/join.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: create master.key file
    copy:
      content: "{{ master_key }}"
      dest: "/opt/jfrog/artifactory/var/etc/security/master.key"
      owner: artifactory
      group: artifactory
      mode: '0600'
  - name: deploy system.yaml configuration
    template:
      src: "system.j2"
      dest: "/opt/jfrog/artifactory/var/etc/system.yaml"
      owner: artifactory
      group: artifactory
      mode: '0644'
  - name: open firewall port 8082
    firewalld:
      port: 8082/tcp
      permanent: true
      immediate: true
  - name: allow selinux listen on tcp port 8082
    seport:
      ports: 8082
      proto: tcp
      setype: http_port_t
      state: present
  - name: restart artifactory and firewalld
    service:
      name: "{{ item }}"
      state: restarted
      enabled: true
      loop:
        - firewalld
        - artifactory
