---
- name: base setup
  hosts: all
  tasks:
  - name: install system packages
    yum:
      name: "{{ item }}"
      state: latest
    loop:
      - python3
      - python3-pip
      - unzip
      - vim
      - curl
    when: inventory_hostname in groups['control']
  - name: upgrade ansible-core
    shell: "{{ item }}"
    loop:
      - 'python3 -m pip install --upgrade ansible-core'
    when: inventory_hostname in groups['control']
  - name: install system packages
    yum:
      name: "{{ item }}"
      state: latest
    loop:
      - python3
      - python3-pip
      - unzip
      - vim
      - curl
      - java-17-openjdk
      - java-17-openjdk-devel
    when: inventory_hostname in groups['jfrog']
  - name: generate root SSH keypair for control
    community.crypto.openssh_keypair:
      path: /root/.ssh/id_rsa
      owner: root
      group: root
      force: false
    when: inventory_hostname in groups['control']
  - name: copy control root public key to nodes
    authorized_key:
      user: root
      state: present
      key: "{{ lookup('file', '/root/.ssh/id_rsa.pub') }}"
    when: inventory_hostname in groups['jfrog']
  - name: toggle off ask_pass
    lineinfile:
      path: "{{ playbook_dir }}/ansible.cfg"
      regex: '^ask_pass'
      line: ask_pass=false
    when: inventory_hostname in groups['control']
